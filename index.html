  <style>
    :root{--bg:#f7f6f1;--paper:#fffefa;--ink:#183b37;--text:#30433e;--muted:#6c7b72;--line:#dddeda;--green:#21564d;--pale:#e8eee7;--rust:#b66949;--sand:#d0aa80;--serif:'Frank Ruhl Libre',Georgia,'Times New Roman',serif;--sans:'Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
    *{box-sizing:border-box;margin:0}
    html,body{height:100%}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);display:grid;place-items:center;padding:24px 16px;min-height:100%;
      background-image:radial-gradient(circle at 85% 12%,#e8eee7 0,transparent 42%),radial-gradient(circle at 10% 92%,#f1e4d8 0,transparent 38%)}
    .gate{width:100%;max-width:470px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 70px #173f3b14,0 2px 6px #173f3b0a;overflow:hidden;animation:rise .7s cubic-bezier(.22,1,.36,1) both}
    .art{background:var(--ink);color:var(--paper);padding:26px 30px 20px;position:relative;overflow:hidden}
    .art svg{display:block;width:100%;height:auto}
    .eyebrow{font-size:10px;letter-spacing:2.2px;color:#b9cbb9;display:flex;align-items:center;gap:9px;margin-bottom:6px}
    .mark{font:20px var(--serif);color:var(--paper);letter-spacing:-.5px}
    .mark span{color:var(--sand)}
    .path-line{stroke-dasharray:4 6;animation:dash 26s linear infinite}
    .body{padding:28px 30px 26px}
    h1{font:500 44px/1.1 var(--serif);color:var(--ink);letter-spacing:-.4px;margin-bottom:12px}
    .lead{font-size:16.5px;line-height:1.85;color:var(--text);margin-bottom:10px}
    .note{font-size:13.5px;line-height:1.75;color:var(--muted);display:flex;gap:8px;align-items:flex-start;margin-bottom:22px}
    .note svg{flex:none;margin-top:3px}
    label.field{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
    .row{display:flex;gap:9px}
    input[type=password]{flex:1;min-width:0;font:16px var(--sans);padding:13px 14px;border:1px solid #cdd3cc;border-radius:10px;background:#fff;color:var(--ink);direction:ltr;text-align:left;transition:border-color .2s,box-shadow .2s}
    input[type=password]:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px #21564d1f}
    button{font:500 15px var(--sans);padding:0 20px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);cursor:pointer;white-space:nowrap;transition:background .2s,transform .2s}
    button:hover{background:var(--green)}
    button:active{transform:translateY(1px)}
    button:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
    button[disabled]{opacity:.65;cursor:progress}
    .remember{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:13px;cursor:pointer;width:fit-content}
    .remember input{accent-color:var(--green);width:15px;height:15px}
    .error{min-height:20px;font-size:13px;color:var(--rust);margin-top:9px}
    .shake{animation:shake .4s}
    footer{border-top:1px solid var(--line);padding:15px 30px;font-size:11.5px;line-height:1.7;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .gate.leaving{animation:leave .45s ease-in both}
    noscript{display:block;margin-top:12px;font-size:13px;color:var(--rust)}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}}
    @keyframes leave{to{opacity:0;transform:translateY(-10px) scale(.985)}}
    @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
    @keyframes dash{to{stroke-dashoffset:-400}}
    @media (max-width:420px){.art,.body{padding-inline:22px}footer{padding-inline:22px}h1{font-size:34px}.row{flex-direction:column}button{padding:13px}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>

      <p class="lead">מן הכיוון הראשוני ועד שלד המבוא: שישה חודשים של חשיבה, שיחות וטיוטות, מאפריל ועד אוקטובר 2026.</p>

const KEY='thesis-gate-key-v2';
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const enc=new TextEncoder();

async function derive(pw){
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function open(key){
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(stream).text();
}
function show(html){
  document.open();document.write(html);document.close();
}
function store(raw,persist){
  const v=P.s+':'+raw;
  try{sessionStorage.setItem(KEY,v)}catch{}
  if(persist){try{localStorage.setItem(KEY,v)}catch{}}
}
function forget(){
  try{sessionStorage.removeItem(KEY)}catch{}
  try{localStorage.removeItem(KEY)}catch{}
}

// Returning visitor: reuse the stored key if it still matches this build's salt.
(async()=>{
  let v=null;
  try{v=sessionStorage.getItem(KEY)||localStorage.getItem(KEY)}catch{}
  if(!v)return;
  const [salt,raw]=v.split(':');
  if(salt!==P.s){forget();return}
  const root=document.documentElement;
  root.style.visibility='hidden';
  try{
    const key=await crypto.subtle.importKey('raw',b64(raw),'AES-GCM',false,['decrypt']);
    show(await open(key));
  }catch{forget();root.style.visibility=''}
})();

$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=$('pw').value,go=$('go'),err=$('error');
  if(!pw)return;
  go.disabled=true;go.textContent='פותח…';err.textContent='';
  try{
    const key=await derive(pw);
    const html=await open(key);
    store(toB64(await crypto.subtle.exportKey('raw',key)),$('remember').checked);
    $('gate').classList.add('leaving');
    setTimeout(()=>show(html),matchMedia('(prefers-reduced-motion: reduce)').matches?0:420);
  }catch{
    go.disabled=false;go.textContent='כניסה למסע ←';
    err.textContent='הסיסמה אינה נכונה. כדאי לנסות שוב.';
    const g=$('gate');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');
    $('pw').select();
  }
});
})();
</script>
